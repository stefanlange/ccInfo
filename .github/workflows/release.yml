name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag does not exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ inputs.version }}$"; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild -project CCInfo/CCInfo.xcodeproj \
                     -scheme CCInfo \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     MARKETING_VERSION="${{ inputs.version }}"

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Fix executable permissions
        run: chmod +x build/Build/Products/Release/CCInfo.app/Contents/MacOS/CCInfo

      - name: Ad-hoc code sign
        run: |
          APP="build/Build/Products/Release/CCInfo.app"
          FRAMEWORKS="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          # Sign nested Sparkle executables individually (--deep corrupts XPC entitlements,
          # and signing only the framework misses nested bundles)
          codesign --force --sign - "$FRAMEWORKS/XPCServices/Installer.xpc"
          codesign --force --sign - "$FRAMEWORKS/Autoupdate.app"
          codesign --force --sign - "$FRAMEWORKS/Updater.app"
          codesign --force --sign - "$APP/Contents/Frameworks/Sparkle.framework"
          # Then sign the app itself with entitlements
          codesign --force --sign - --entitlements CCInfo/CCInfo/Resources/CCInfo.entitlements "$APP"

      - name: Create DMG
        run: |
          mkdir -p dmg-contents
          cp -R build/Build/Products/Release/CCInfo.app dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "ccInfo" -srcfolder dmg-contents -ov -format UDZO "ccInfo-v${{ inputs.version }}.dmg"

      - name: Extract release notes
        id: notes
        run: |
          body=$(awk '/^## ${{ inputs.version }} /{found=1; next} /^## /{if(found) exit} found' RELEASENOTES.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Convert release notes to HTML sidecar
        run: |
          cat > /tmp/relnotes.md << 'ENDOFNOTES'
          ${{ steps.notes.outputs.body }}
          ENDOFNOTES
          npx --yes marked /tmp/relnotes.md > "ccInfo-v${{ inputs.version }}.html"

      - name: Download Sparkle tools
        run: |
          curl -L \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.0/Sparkle-2.9.0.tar.xz" \
            -o /tmp/Sparkle.tar.xz
          tar -xf /tmp/Sparkle.tar.xz -C /tmp bin/generate_appcast
          chmod +x /tmp/bin/generate_appcast

      - name: Checkout gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git worktree add ./gh-pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages ./gh-pages
            touch ./gh-pages/.nojekyll
            git -C ./gh-pages add .nojekyll
            git -C ./gh-pages commit -m "Initialize gh-pages branch"
            git -C ./gh-pages push "https://x-access-token:${GITHUB_TOKEN}@github.com/stefanlange/ccInfo.git" gh-pages
          fi

      - name: Copy release artifacts to gh-pages
        run: |
          cp "ccInfo-v${{ inputs.version }}.dmg" ./gh-pages/
          cp "ccInfo-v${{ inputs.version }}.html" ./gh-pages/

      - name: Generate and sign appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set"
            exit 1
          fi
          echo "$SPARKLE_PRIVATE_KEY" | /tmp/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://stefanlange.github.io/ccInfo/" \
            --link "https://github.com/stefanlange/ccInfo" \
            --maximum-versions 5 \
            --embed-release-notes \
            ./gh-pages

      - name: Verify appcast signature
        run: |
          if ! grep -q 'sparkle:edSignature' ./gh-pages/appcast.xml; then
            echo "::error::appcast.xml missing EdDSA signature -- check SPARKLE_PRIVATE_KEY secret"
            exit 1
          fi
          echo "appcast.xml contains EdDSA signature -- OK"

      - name: Deploy appcast to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./gh-pages
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Release v${{ inputs.version }}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/stefanlange/ccInfo.git" gh-pages
          else
            echo "No changes to push to gh-pages"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          files: ccInfo-v${{ inputs.version }}.dmg
          body: ${{ steps.notes.outputs.body }}
